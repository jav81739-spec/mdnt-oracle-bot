name: Midnight Oracle CI

on:
  push:
    branches:
      - main
      - 'rebuild/**'
  pull_request:
    branches:
      - main
      - 'rebuild/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python
        run: python -m compileall -q .

      - name: Dependency check
        run: pip check

      - name: Import smoke test
        env:
          BOT_TOKEN: test-token
          GROUP_CHAT_ID: '0'
          OWNER_ID: '0'
        run: |
          python - <<'PY'
          import importlib
          modules = [
              'midnight_oracle.friend_engine',
              'midnight_oracle.handlers.message_handler',
              'midnight_oracle.database',
              'midnight_oracle.generators.reply_generator',
          ]
          for name in modules:
              importlib.import_module(name)
              print('OK', name)
          PY

      - name: Run tests
        env:
          BOT_TOKEN: test-token
          GROUP_CHAT_ID: '0'
          OWNER_ID: '0'
        run: python -m unittest discover -s tests -v
