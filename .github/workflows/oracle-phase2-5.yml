name: Midnight Oracle Phase 2-5

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or commit SHA to verify
        required: false
        default: main
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile package
        run: python -m compileall -q midnight_oracle
      - name: Import smoke test
        run: python -c "import midnight_oracle.main, midnight_oracle.engines.joke_engine, midnight_oracle.engines.absence_engine, midnight_oracle.engines.achievement_engine, midnight_oracle.games.game_engine, midnight_oracle.games.truth_dare, midnight_oracle.games.would_you_rather, midnight_oracle.games.never_have_i_ever, midnight_oracle.games.word_scramble, midnight_oracle.games.prediction, midnight_oracle.handlers.inline_handler, midnight_oracle.handlers.webapp_handler"
      - name: Phase 1 tests
        run: python -m unittest midnight_oracle.friend_engine_test
      - name: Runtime surface regression tests
        run: python -m unittest tests.test_production_entrypoint_contract tests.test_production_import tests.test_runtime_manifest tests.test_runtime_regressions tests.test_runtime_smoke -v
