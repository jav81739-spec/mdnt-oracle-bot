name: One-time Telegram conflict hardening

on:
  push:
    branches: [rebuild/core-engine-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: harden Telegram conflict ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/core-engine-v2
          fetch-depth: 0

      - name: Apply final polling ownership fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text()

          old = '''        elapsed = time.monotonic() - started
        if elapsed >= _POLLING_LEASE_TAKEOVER_AFTER:
            replaced = await storage.eval(
                "if redis.call('exists',KEYS[1]) == 1 then redis.call('set',KEYS[1],ARGV[1],'EX',ARGV[2]) return 1 else return 0 end",
                [lease_key],
                [token, str(_POLLING_LEASE_TTL)],
            )
            if int(replaced or 0) == 1:
                log.warning("POLLING_LEASE takeover after %ss; previous poller will self-terminate on renewal", int(elapsed))
                return token
'''
          if old not in s:
              raise SystemExit('forced takeover block not found')
          s = s.replace(old, '', 1)

          old = '''    # Render can overlap old/new instances during deploys. At this point the
    # old instance should have received shutdown; atomically take over the
    # lease and let the old renewal loop notice ownership loss and exit.
    lease_key = _polling_lease_key()
    if await storage.set(lease_key, token, ttl=_POLLING_LEASE_TTL):
        log.warning("POLLING_LEASE takeover after %ss; old instance will self-terminate", _POLLING_LEASE_WAIT)
        await asyncio.sleep(5)
        return token
    raise RuntimeError("Unable to acquire Midnight Telegram polling lease")
'''
          new = '''    raise RuntimeError("Unable to acquire Midnight Telegram polling lease; another poller still owns it")
'''
          if old not in s:
              raise SystemExit('deadline takeover block not found')
          s = s.replace(old, new, 1)

          old = '''            except Conflict:
                log.warning("TELEGRAM_CONFLICT another getUpdates poller is still active; waiting 10s before retry")
                time.sleep(10)
'''
          new = '''            except Conflict:
                log.error("TELEGRAM_CONFLICT another getUpdates poller owns this bot token; stopping this process")
                break
'''
          if old not in s:
              raise SystemExit('Conflict retry block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Verify production entrypoint
        run: python -m py_compile bot.py

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git rm .github/workflows/one-time-conflict-hardening.yml
          git commit -m 'fix: harden Telegram conflict ownership'
          git push origin HEAD:rebuild/core-engine-v2
