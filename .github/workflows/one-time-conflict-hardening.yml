name: One-time Telegram conflict hardening

on:
  push:
    branches: [rebuild/core-engine-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: harden Telegram conflict ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/core-engine-v2
          fetch-depth: 0

      - name: Patch polling ownership and explicit error handler installation
        shell: python
        run: |
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text()

          old = 'from core.owner_tools import install as install_owner_tools, publish_owner_menu\n'
          new = old + 'from core.error_handling import install_error_handler\n'
          if 'from core.error_handling import install_error_handler' not in s:
              if old not in s:
                  raise SystemExit('owner_tools import anchor not found')
              s = s.replace(old, new, 1)

          old = '_POLLING_LEASE_TAKEOVER_AFTER = 120\n_POLLING_LEASE_TTL = 90\n'
          new = '_POLLING_LEASE_TAKEOVER_AFTER = 75\n_POLLING_LEASE_TTL = 90\n'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'while not stop_event.wait(30):\n'
          new = 'while not stop_event.wait(5):\n'
          if old not in s:
              raise SystemExit('lease renewal interval anchor not found')
          s = s.replace(old, new, 1)

          old = '        await storage.start()\n        await _legacy_post_init(application)\n'
          new = '        await storage.start()\n        install_error_handler(application)\n        await _legacy_post_init(application)\n'
          if old not in s:
              raise SystemExit('post_init anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Verify
        run: python -m py_compile bot.py core/error_handling.py

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-conflict-hardening.yml
          git add bot.py core/error_handling.py
          git commit -m 'fix: harden Telegram conflict ownership'
          git push origin HEAD:rebuild/core-engine-v2
