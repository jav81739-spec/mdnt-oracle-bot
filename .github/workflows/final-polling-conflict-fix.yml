name: Final polling conflict hardening

on:
  push:
    branches: [rebuild/core-engine-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: stop on telegram polling conflict'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/core-engine-v2
          fetch-depth: 0

      - name: Patch Telegram conflict handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text()
          old = '''            except Conflict:\n                log.warning("TELEGRAM_CONFLICT another getUpdates poller is still active; waiting 10s before retry")\n                time.sleep(10)\n'''
          new = '''            except Conflict:\n                log.error("TELEGRAM_CONFLICT another getUpdates poller is active; stopping this process to prevent duplicate polling")\n                raise SystemExit(75)\n'''
          if old not in s:
              raise SystemExit('expected polling conflict block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python -m py_compile bot.py

      - name: Commit patch and remove one-time workflow
        run: |
          rm -f .github/workflows/final-polling-conflict-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py .github/workflows/final-polling-conflict-fix.yml
          git commit -m "fix: stop on telegram polling conflict"
          git push origin HEAD:rebuild/core-engine-v2
