name: One-time fix polling lease runtime

on:
  push:
    branches:
      - rebuild/core-engine-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'jav81739-spec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/core-engine-v2
          fetch-depth: 0

      - name: Patch undefined polling lease key helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text()
          marker = '_health_server = None\n'
          helper = '''_health_server = None\n\ndef _polling_lease_key():\n    """Return a bot-token-scoped lease key without storing the raw token."""\n    bot_token = os.getenv("BOT_TOKEN", "").strip()\n    if not bot_token:\n        return _POLLING_LEASE_KEY\n    digest = hashlib.sha256(bot_token.encode("utf-8")).hexdigest()[:32]\n    return f"{_POLLING_LEASE_KEY}:{digest}"\n'''
          if 'def _polling_lease_key(' not in s:
              if marker not in s:
                  raise SystemExit('anchor not found')
              s = s.replace(marker, helper, 1)
          # The takeover CAS must use the same token-scoped key as acquisition.
          old = '''                [_POLLING_LEASE_KEY],\n                [token, str(_POLLING_LEASE_TTL)],'''
          new = '''                [lease_key],\n                [token, str(_POLLING_LEASE_TTL)],'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Compile check
        run: python -m py_compile bot.py

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: define token-scoped polling lease key helper'
          git push origin HEAD:rebuild/core-engine-v2

      - name: Remove one-time workflow
        if: success()
        run: |
          git pull --rebase origin rebuild/core-engine-v2
          if [ -f .github/workflows/fix-polling-key-runtime.yml ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm .github/workflows/fix-polling-key-runtime.yml
            git commit -m 'chore: remove one-time polling key fixer'
            git push origin HEAD:rebuild/core-engine-v2
          fi
