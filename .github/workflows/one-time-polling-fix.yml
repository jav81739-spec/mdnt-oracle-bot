name: One-time polling lease fix

on:
  push:
    branches:
      - rebuild/core-engine-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch polling lease startup
        env:
          BRANCH: rebuild/core-engine-v2
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("bot.py")
          s = p.read_text()
          s = s.replace('_POLLING_LEASE_KEY = "midnight:telegram:polling-lease:v2"', '_POLLING_LEASE_KEY = "midnight:telegram:polling-lease:v3"\n_POLLING_LEASE_TAKEOVER_AFTER = 120')
          old = '''    deadline = time.monotonic() + _POLLING_LEASE_WAIT\n    while time.monotonic() < deadline:\n        if await storage.setnx(_POLLING_LEASE_KEY, token, ttl=_POLLING_LEASE_TTL):\n            log.info("POLLING_LEASE acquired instance=%s ttl=%ss", os.getenv("RENDER_INSTANCE_ID", "unknown"), _POLLING_LEASE_TTL)\n            return token\n        remaining = max(0, int(deadline - time.monotonic()))\n        log.warning("POLLING_LEASE busy; waiting for current Telegram poller (%ss remaining)", remaining)\n        await asyncio.sleep(3)\n    raise RuntimeError("Timed out waiting for the existing Midnight Telegram poller to release its lease")'''
          new = '''    started = time.monotonic()\n    deadline = started + max(_POLLING_LEASE_WAIT, _POLLING_LEASE_TAKEOVER_AFTER + _POLLING_LEASE_TTL)\n    while time.monotonic() < deadline:\n        if await storage.setnx(_POLLING_LEASE_KEY, token, ttl=_POLLING_LEASE_TTL):\n            log.info("POLLING_LEASE acquired instance=%s ttl=%ss", os.getenv("RENDER_INSTANCE_ID", "unknown"), _POLLING_LEASE_TTL)\n            return token\n        elapsed = time.monotonic() - started\n        if elapsed >= _POLLING_LEASE_TAKEOVER_AFTER:\n            replaced = await storage.eval(\n                "if redis.call('exists',KEYS[1]) == 1 then redis.call('set',KEYS[1],ARGV[1],'EX',ARGV[2]) return 1 else return 0 end",\n                [_POLLING_LEASE_KEY],\n                [token, str(_POLLING_LEASE_TTL)],\n            )\n            if int(replaced or 0) == 1:\n                log.warning("POLLING_LEASE takeover after %ss; previous poller will self-terminate on renewal", int(elapsed))\n                return token\n        remaining = max(0, int(deadline - time.monotonic()))\n        log.warning("POLLING_LEASE busy; waiting for current Telegram poller (%ss remaining)", remaining)\n        await asyncio.sleep(3)\n    raise RuntimeError("Timed out waiting for the existing Midnight Telegram poller to release its lease")'''
          if old not in s:
              raise SystemExit("expected polling lease block not found")
          s = s.replace(old, new)
          p.write_text(s)
          PY

          if git diff --quiet -- bot.py; then
            echo "No patch applied; aborting."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "fix: recover polling lease during Render overlap"
          git push origin "$BRANCH"

          rm -f .github/workflows/one-time-polling-fix.yml
          git add .github/workflows/one-time-polling-fix.yml
          git commit -m "chore: remove one-time polling fix workflow"
          git push origin "$BRANCH"