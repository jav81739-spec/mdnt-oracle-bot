name: Midnight Exact Main Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        test: [tests/test_command_surface_integrity.py]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python -m unittest "${{ matrix.test }}" -v
