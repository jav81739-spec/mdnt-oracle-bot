name: Midnight Exact Main Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probes:
    strategy:
      fail-fast: false
      matrix:
        probe:
          - import-bot
          - import-main
          - build-application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Probe ${{ matrix.probe }}
        env:
          BOT_TOKEN: test-token
          TELEGRAM_BOT_TOKEN: ci-telegram-token-1234567890
          OPENAI_API_KEY: ci-openai-key-1234567890
          GIPHY_API_KEY: ci-giphy-key-1234567890
          STICKER_PACK_NAME: ci-stickers
          ORACLE_MASTER_ID: '1'
          DATABASE_URL: sqlite:///ci.sqlite3
          ORACLE_DATABASE_PATH: ci.sqlite3
          GROUP_CHAT_ID: '0'
          OWNER_ID: '0'
        run: |
          case "${{ matrix.probe }}" in
            import-bot) python -c 'import bot; print("bot import ok")' ;;
            import-main) python -c 'import midnight_oracle.main; print("main import ok")' ;;
            build-application) python -c 'import bot; app=bot.build_application(); print("application build ok", len(app.handlers)); app.handlers.clear()' ;;
          esac
