name: Midnight Exact Main Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probes:
    strategy:
      fail-fast: false
      matrix:
        probe:
          - message-handler
          - callback-handler
          - command-handler
          - voice-handler
          - inline-handler
          - world-handler
          - prediction-handler
          - webapp-handler
          - surprise-handler
          - scheduler
          - main
          - bot-import
          - build-application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Probe ${{ matrix.probe }}
        env:
          BOT_TOKEN: test-token
          TELEGRAM_BOT_TOKEN: ci-telegram-token-1234567890
          OPENAI_API_KEY: ci-openai-key-1234567890
          GIPHY_API_KEY: ci-giphy-key-1234567890
          STICKER_PACK_NAME: ci-stickers
          ORACLE_MASTER_ID: '1'
          DATABASE_URL: sqlite:///ci.sqlite3
          ORACLE_DATABASE_PATH: ci.sqlite3
          GROUP_CHAT_ID: '0'
          OWNER_ID: '0'
        run: |
          case "${{ matrix.probe }}" in
            message-handler) python -c 'import midnight_oracle.handlers.message_handler; print("message handler ok")' ;;
            callback-handler) python -c 'import midnight_oracle.handlers.callback_handler; print("callback handler ok")' ;;
            command-handler) python -c 'import midnight_oracle.handlers.command_handler; print("command handler ok")' ;;
            voice-handler) python -c 'import midnight_oracle.handlers.voice_handler; print("voice handler ok")' ;;
            inline-handler) python -c 'import midnight_oracle.handlers.inline_handler; print("inline handler ok")' ;;
            world-handler) python -c 'import midnight_oracle.handlers.world_handler; print("world handler ok")' ;;
            prediction-handler) python -c 'import midnight_oracle.handlers.prediction_handler; print("prediction handler ok")' ;;
            webapp-handler) python -c 'import midnight_oracle.handlers.webapp_handler; print("webapp handler ok")' ;;
            surprise-handler) python -c 'import midnight_oracle.handlers.surprise_handler; print("surprise handler ok")' ;;
            scheduler) python -c 'import midnight_oracle.scheduler; print("scheduler ok")' ;;
            main) python -c 'import midnight_oracle.main; print("main ok")' ;;
            bot-import) python -c 'import bot; print("bot ok")' ;;
            build-application) python -c 'import bot; app=bot.build_application(); print("application build ok", len(app.handlers)); app.handlers.clear()' ;;
          esac
