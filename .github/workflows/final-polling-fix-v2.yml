name: Build Final Polling Ownership Fix

on:
  push:
    branches: [rebuild/core-engine-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/core-engine-v2
          fetch-depth: 0

      - name: Patch polling ownership safely
        shell: python
        run: |
          from pathlib import Path

          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")

          old_constants = '''_POLLING_LEASE_KEY = "midnight:telegram:polling-lease:v3"\n_POLLING_LEASE_TAKEOVER_AFTER = 75\n_POLLING_LEASE_TTL = 90\n_POLLING_LEASE_WAIT = 150'''
          new_constants = '''_POLLING_LEASE_KEY = "midnight:telegram:polling-lease:v3"\n_POLLING_LEASE_TTL = 90\n_POLLING_LEASE_WAIT = 180'''
          if old_constants not in text:
              raise SystemExit("Expected polling lease constants were not found; refusing to modify bot.py")
          text = text.replace(old_constants, new_constants, 1)

          old_middle = '''        elapsed = time.monotonic() - started\n        if elapsed >= _POLLING_LEASE_TAKEOVER_AFTER:\n            replaced = await storage.eval(\n                "if redis.call('exists',KEYS[1]) == 1 then redis.call('set',KEYS[1],ARGV[1],'EX',ARGV[2]) return 1 else return 0 end",\n                [lease_key],\n                [token, str(_POLLING_LEASE_TTL)],\n            )\n            if int(replaced or 0) == 1:\n                log.warning("POLLING_LEASE takeover after %ss; previous poller will self-terminate on renewal", int(elapsed))\n                return token\n        remaining = max(0, int(deadline - time.monotonic()))'''
          new_middle = '''        remaining = max(0, int(deadline - time.monotonic()))'''
          if old_middle not in text:
              raise SystemExit("Expected forced takeover block was not found; refusing to modify bot.py")
          text = text.replace(old_middle, new_middle, 1)

          old_tail = '''    # Render can overlap old/new instances during deploys. At this point the\n    # old instance should have received shutdown; atomically take over the\n    # lease and let the old renewal loop notice ownership loss and exit.\n    lease_key = _polling_lease_key()\n    if await storage.set(lease_key, token, ttl=_POLLING_LEASE_TTL):\n        log.warning("POLLING_LEASE takeover after %ss; old instance will self-terminate", _POLLING_LEASE_WAIT)\n        await asyncio.sleep(5)\n        return token\n    raise RuntimeError("Unable to acquire Midnight Telegram polling lease")'''
          new_tail = '''    raise RuntimeError(\n        "Timed out waiting for the existing Midnight Telegram poller to release its lease"\n    )'''
          if old_tail not in text:
              raise SystemExit("Expected final forced takeover block was not found; refusing to modify bot.py")
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text, encoding="utf-8")

      - name: Compile and verify ownership invariants
        shell: bash
        run: |
          python -m py_compile bot.py
          ! grep -n "POLLING_LEASE_TAKEOVER_AFTER\|takeover after\|previous poller will self-terminate" bot.py
          grep -n "Timed out waiting for the existing Midnight Telegram poller" bot.py
          grep -n "TELEGRAM_CONFLICT another getUpdates poller owns this bot token; stopping this process" bot.py

      - name: Commit final application fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No application change was produced"; exit 1; }
          git commit -m "fix: remove forced Telegram polling lease takeover"
          git push origin HEAD:rebuild/core-engine-v2

      - name: Remove temporary builder
        if: success()
        shell: bash
        run: |
          git fetch origin rebuild/core-engine-v2
          git checkout --detach origin/rebuild/core-engine-v2
          git rm -f .github/workflows/final-polling-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time polling builder"
          git push origin HEAD:rebuild/core-engine-v2
