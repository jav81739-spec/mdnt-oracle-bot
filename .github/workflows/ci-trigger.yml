name: Midnight Oracle CI Trigger

on:
  push:
    branches:
      - main
      - 'rebuild/**'
  pull_request:
    branches:
      - main
      - 'rebuild/**'

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger canonical CI workflow
        run: echo "CI trigger confirmed for $GITHUB_SHA"
