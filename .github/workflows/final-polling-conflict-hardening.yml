name: Final polling conflict hardening

on:
  push:
    branches:
      - rebuild/core-engine-v2

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, 'run final polling conflict hardening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/core-engine-v2
          fetch-depth: 0
      - name: Make Telegram Conflict fatal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text()
          old = '''            except Conflict:\n                log.warning("TELEGRAM_CONFLICT another getUpdates poller is still active; waiting 10s before retry")\n                time.sleep(10)\n'''
          new = '''            except Conflict:\n                log.error("TELEGRAM_CONFLICT another getUpdates poller owns this bot token; stopping this process")\n                break\n'''
          if old not in s:
              raise SystemExit('expected polling conflict retry block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python -m py_compile bot.py
      - name: Commit hardened entrypoint and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-polling-conflict-hardening.yml
          git add bot.py .github/workflows/final-polling-conflict-hardening.yml
          git commit -m "fix: stop polling immediately on Telegram conflict [skip ci]"
          git push origin HEAD:rebuild/core-engine-v2
